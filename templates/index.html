<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Placement Predictor</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

<div class="container">

    <h1>🎓 Placement Predictor</h1>

    <form id="predictForm" action="/predict" method="post">

        <label>CGPA</label>
        <input
            type="number"
            step="0.1"
            name="cgpa"
            placeholder="Enter CGPA"
            value="{{ cgpa }}"
            required
        >

        <label>Aptitude Score</label>
        <input
            type="number"
            name="aptitude"
            placeholder="Enter Aptitude Score"
            value="{{ aptitude }}"
            required
        >

        <label>Projects</label>
        <input
            type="number"
            name="projects"
            placeholder="Enter Number of Projects"
            value="{{ projects }}"
            required
        >

        <div class="button-group">

            <button
                type="submit"
                class="predict-btn">
                Predict
            </button>

            <button
                type="button"
                class="reset-btn"
                onclick="resetForm()">
                Reset
            </button>

        </div>

    </form>

    <div class="card">

        <h2>📊 Placement Probability</h2>

        <div class="probability">
            {{ placement_probability }}%
        </div>

        <div class="progress">
            <div
                class="progress-bar"
                style="width: {{ placement_probability }}%;">
            </div>
        </div>

        <div class="result">
            {{ result }}
        </div>

    </div>

    <div class="card">

        <h2>💡 Recommendations</h2>

        <ul id="recommendationList">
            {% for item in recommendations %}
                <li>{{ item }}</li>
            {% endfor %}
        </ul>

    </div>

</div>

<script>

function resetForm() {

    document.querySelector('input[name="cgpa"]').value = "";
    document.querySelector('input[name="aptitude"]').value = "";
    document.querySelector('input[name="projects"]').value = "";

    document.querySelector(".result").innerHTML = "";

    document.querySelector(".probability").innerHTML = "0%";

    document.querySelector(".progress-bar").style.width = "0%";

    document.getElementById("recommendationList").innerHTML = "";
}

</script>

</body>
</html>
